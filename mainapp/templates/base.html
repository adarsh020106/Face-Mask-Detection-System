<!doctype html>
<html lang="en">
<!-- ==========================================================================
     FaceGuard AI — Master Base Template (templates/base.html)
     Compatible with Django 4.x / 5.x Template Inheritance
     ========================================================================== -->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>{% block title %}FaceGuard AI — Real-time Face Mask Detection System{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Automated Face Mask Detection System powered by OpenCV, TensorFlow & Deep Learning for enterprise, healthcare and educational safety compliance.{% endblock %}">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">

  <!-- Google Fonts: Plus Jakarta Sans for refined typographic hierarchy -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3.3 CSS via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

  <!-- Bootstrap Icons 1.11.3 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- FaceGuard AI Custom Stylesheet -->
  <link rel="stylesheet" href="/static/css/style.css">

  <!-- Django static tag alternative:
       {% load static %}
       <link rel="stylesheet" href="{% static 'css/style.css' %}">
  -->

  {% block extra_css %}{% endblock %}
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- 1. Master Navigation Bar Component -->
  {% include 'components/navbar.html' %}

  <!-- 2. System / Django Flash Messages -->
  {% include 'components/messages.html' %}

  <!-- 3. Primary Page Content Block -->
  <main class="flex-shrink-0">
    {% block content %}
    <!-- Child templates will inject their page content here -->
    {% endblock %}
  </main>

  <!-- 4. Reusable Master Footer Component -->
  {% include 'components/footer.html' %}

  <!-- Bootstrap 5.3.3 Bundle JavaScript (Includes Popper for Tooltips & Dropdowns) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

  <!-- FaceGuard AI Custom Vanilla JavaScript -->
  <script src="/static/js/main.js"></script>

  <!-- Django static tag alternative:
       <script src="{% static 'js/main.js' %}"></script>
  -->

  {% block extra_js %}{% endblock %}
</body>
</html>
