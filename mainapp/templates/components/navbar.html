<!-- ==========================================================================
     FaceGuard AI — Reusable Navigation Component (templates/components/navbar.html)
     ========================================================================== -->
<nav class="navbar navbar-expand-xl navbar-custom sticky-top">
  <div class="container-fluid">
    <!-- Brand Logo & Name -->
    <a class="navbar-brand" href="{% url 'home' %}">
      <div class="brand-icon-wrapper">
        <i class="bi bi-shield-check"></i>
      </div>
      <span>FaceGuard <span class="text-primary">AI</span></span>
    </a>

    <!-- Mobile Hamburger Toggle Button -->
    <button 
      class="navbar-toggler border-0 shadow-none" 
      type="button" 
      data-bs-toggle="collapse" 
      data-bs-target="#navbarMainContent" 
      aria-controls="navbarMainContent" 
      aria-expanded="false" 
      aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Navigation Links & User Actions -->
    <div class="collapse navbar-collapse" id="navbarMainContent">
      <ul class="navbar-nav mb-2 mx-auto gap-1">
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'home' or current_page == 'home' %}active{% endif %}" href="{% url 'home' %}">
            <i class="bi bi-house-door"></i> Home
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'about' or current_page == 'about' %}active{% endif %}" href="{% url 'about' %}">
            <i class="bi bi-info-circle"></i> About
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'live_detection' or current_page == 'live_detection' %}active{% endif %}" href="{% url 'live_detection' %}">
            <i class="bi bi-camera-video"></i> Live Detection
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'image_detection' or current_page == 'image_detection' %}active{% endif %}" href="{% url 'image_detection' %}">
            <i class="bi bi-upload"></i> Image Detection
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.resolver_match.url_name == 'dashboard' or current_page == 'dashboard' %}active{% endif %}" href="{% url 'dashboard' %}">
            <i class="bi bi-speedometer2"></i> Dashboard
          </a>
        </li>
        <li class="nav-item d-block d-lg-none">
          <a class="nav-link {% if request.resolver_match.url_name == 'history' or current_page == 'history' %}active{% endif %}" href="{% url 'history' %}">
            <i class="bi bi-clock-history"></i> History
          </a>
        </li>
      </ul>

      <!-- Right Side Auth Menu (Django Context Dependent) -->
      <div class="d-flex align-items-center gap-2">
        {% if request.session.user_id %}
        <!-- Authenticated User Dropdown -->
        <div class="dropdown">
          <button 
            class="btn btn-outline-secondary dropdown-toggle d-flex align-items-center gap-2 px-3 py-2 rounded-3" 
            type="button" 
            id="userProfileDropdown" 
            data-bs-toggle="dropdown" 
            aria-expanded="false">
            <i class="bi bi-person-circle text-primary fs-5"></i>
            <span class="fw-semibold">{{ request.session.username }}</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end shadow-sm border-1 mt-2" aria-labelledby="userProfileDropdown">
            <li>
              <a class="dropdown-item d-flex align-items-center gap-2 py-2" href="{% url 'dashboard' %}">
                <i class="bi bi-speedometer2 text-primary"></i> Dashboard
              </a>
            </li>
            <li>
              <a class="dropdown-item d-flex align-items-center gap-2 py-2" href="{% url 'history' %}">
                <i class="bi bi-clock-history text-secondary"></i> Detection Logs
              </a>
            </li>
            <li><hr class="dropdown-divider"></li>
            <li>
              <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="dropdown-item d-flex align-items-center gap-2 py-2 text-danger" type="submit"><i class="bi bi-box-arrow-right"></i> Sign Out</button></form>
            </li>
          </ul>
        </div>
        {% else %}
        <!-- Guest User Action Buttons -->
        <a href="{% url 'login' %}" class="btn btn-link text-decoration-none text-dark fw-semibold px-3">
          Sign In
        </a>
        <a href="{% url 'register' %}" class="btn btn-primary-custom btn-sm px-3">
          <i class="bi bi-person-plus"></i> Register
        </a>
        {% endif %}
      </div>
    </div>
  </div>
</nav>
