
<div class="stat-card">
  <div>
    <div class="stat-label">{{ stat_title|default:"Total Detections" }}</div>
    <div class="stat-value">{{ stat_value|default:"1,248" }}</div>
    {% if stat_trend %}
    <div class="small {{ stat_trend_color|default:'text-success' }} d-flex align-items-center gap-1">
      <i class="bi bi-arrow-up-right"></i> {{ stat_trend }}
    </div>
    {% endif %}
  </div>
  <div class="stat-icon {{ stat_icon_bg|default:'feature-icon-blue' }}">
    <i class="bi {{ stat_icon|default:'bi-graph-up' }}"></i>
  </div>
</div>
