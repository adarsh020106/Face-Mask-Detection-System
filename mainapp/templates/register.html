{% extends 'base.html' %}

{% block title %}Register Account — FaceGuard AI{% endblock %}

{% block content %}
<!-- ==========================================================================
     FaceGuard AI — Registration Page (templates/register.html)
     
     BACKEND INTEGRATION:
     Django Registration View handles POST request:
     - Form: Custom UserCreationForm or django.contrib.auth.models.User
     - Creates new user record and logs them in or redirects to 'login'
     ========================================================================== -->

<div class="auth-wrapper">
  <div class="auth-card" style="max-width: 520px;">
    <!-- Brand Header -->
    <div class="text-center mb-4">
      <div class="brand-icon-wrapper mb-3" style="width: 48px; height: 48px; font-size: 1.5rem; margin: 0 auto;">
        <i class="bi bi-person-plus"></i>
      </div>
      <h3 class="fw-bold text-dark mb-1">Create Account</h3>
      <p class="text-muted small">Register a safety administrator or security officer profile</p>
    </div>

    <!-- Django Form Field Errors (If any returned by backend) -->
    <!-- BACKEND:
    {% if form.errors %}
      <div class="alert alert-danger py-2 px-3 small rounded-3 mb-3" role="alert">
        <ul class="mb-0 ps-3">
          {% for field in form %}
            {% for error in field.errors %}
              <li><strong>{{ field.label }}:</strong> {{ error }}</li>
            {% endfor %}
          {% endfor %}
        </ul>
      </div>
    {% endif %}
    -->

    <!-- Register Form -->
    <form method="POST" action="{% url 'register' %}">
      <!-- Django CSRF Protection Token -->
      {% csrf_token %}

      <!-- Full Name -->
      <div class="mb-3">
        <label for="fullNameInput" class="form-label fw-semibold small text-dark">
          Full Name
        </label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0 text-muted">
            <i class="bi bi-card-heading"></i>
          </span>
          <input 
            type="text" 
            name="full_name" 
            id="fullNameInput" 
            class="form-control border-start-0 ps-0" 
            placeholder="e.g. Officer John Davis" 
            required>
        </div>
      </div>

      <!-- Username & Email (Two Column Row) -->
      <div class="row g-2 mb-3">
        <div class="col-12 col-md-6">
          <label for="regUsernameInput" class="form-label fw-semibold small text-dark">
            Number
          </label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 text-muted">
              <i class="bi bi-person"></i>
            </span>
            <input 
              type="number" 
              name="number" 
              id="regUsernameInput" 
              class="form-control border-start-0 ps-0" 
              placeholder="8288828881" 
              required 
              autocomplete="number">
          </div>
        </div>
        <div class="col-12 col-md-6">
          <label for="regEmailInput" class="form-label fw-semibold small text-dark">
            Email Address
          </label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 text-muted">
              <i class="bi bi-envelope"></i>
            </span>
            <input 
              type="email" 
              name="username" 
              id="regEmailInput" 
              class="form-control border-start-0 ps-0" 
              placeholder="john@facility.org" 
              required 
              autocomplete="username">
          </div>
        </div>
      </div>

      <!-- Password & Confirm Password (Two Column Row) -->
      <div class="row g-2 mb-3">
        <div class="col-12 col-md-6">
          <label for="regPasswordInput" class="form-label fw-semibold small text-dark">
            Password
          </label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 text-muted">
              <i class="bi bi-lock"></i>
            </span>
            <input 
              type="password" 
              name="password" 
              id="regPasswordInput" 
              class="form-control border-start-0 ps-0" 
              placeholder="••••••••" 
              required 
              autocomplete="new-password">
          </div>
        </div>
        <div class="col-12 col-md-6">
          <label for="confirmPasswordInput" class="form-label fw-semibold small text-dark">
            Confirm Password
          </label>
          <div class="input-group">
            <span class="input-group-text bg-light border-end-0 text-muted">
              <i class="bi bi-shield-lock"></i>
            </span>
            <input 
              type="password" 
              name="confirm_password" 
              id="confirmPasswordInput" 
              class="form-control border-start-0 ps-0" 
              placeholder="••••••••" 
              required 
              autocomplete="new-password">
          </div>
        </div>
      </div>

      <!-- Terms & Safety Policy Agreement -->
      <div class="mb-4 form-check">
        <input type="checkbox" class="form-check-input" id="agreeTerms" required>
        <label class="form-check-label small text-muted" for="agreeTerms">
          I agree to the facility monitoring terms and privacy regulations.
        </label>
      </div>

      <!-- Submit Button -->
      <button type="submit" class="btn btn-primary-custom w-100 py-2 justify-content-center">
        <i class="bi bi-person-check"></i> Create Account
      </button>
    </form>

    <!-- Login Link -->
    <div class="text-center mt-4 pt-3 border-top">
      <p class="text-muted small mb-0">
        Already have an account? 
        <a href="{% url 'login' %}" class="text-primary fw-semibold text-decoration-none">
          Sign In
        </a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
